<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portfolio of Kennith Albo Pioquento — student, developer, and entrepreneur behind KENSCENT.">
    <meta name="theme-color" content="#ffffff">
    <title>Kennith Albo Pioquento | Portfolio</title>
    <link rel="icon" type="image/png" href="%BASE_URL%Assets/Logo/logoicon.png">
    <script>
      try {
        const theme = localStorage.getItem('kennith-portfolio-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0B111B' : '#FFFFFF';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
